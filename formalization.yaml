version: "v0.4"

project:
  name: "oka"
  description: >-
    A Lean 4 / Mathlib formalization of Oka's coherence theorem and of Serre's GAGA.
    Complex analytic spaces are defined as locally ringed spaces locally cut out in open subsets
    of ℂⁿ, and their structure sheaves are proved coherent (Oka). Schemes locally of finite type
    over ℂ are analytified, and for a proper scheme X over ℂ the three GAGA theorems are proved:
    the comparison maps Hᵠ(X, F) → Hᵠ(X^an, F^an) are bijective for coherent F, analytification is
    fully faithful on coherent sheaves, and every coherent analytic sheaf on X^an is algebraic;
    equivalently analytification is an equivalence Coh(X) ≌ Coh(X^an). The Riemann existence
    theorem is proved: for every scheme X locally of finite type over ℂ, analytification is an
    equivalence between finite étale covers of X and finite étale covers of X^an with separated
    structure map, via a formalisation of the Grauert–Remmert extension theorem. Along the way:
    the ring of convergent power series is a Noetherian regular UFD (Weierstrass preparation and division,
    Rückert basis theorem), the hard half of Rückert's Nullstellensatz, Cartan's Theorem B on
    product domains, Cartan–Serre finiteness on ℙⁿ, Chow's lemma, and relative Serre vanishing.
    The comparison theorem identifies the étale fundamental group of every connected scheme locally
    of finite type over ℂ with the profinite completion of the topological fundamental group of its
    analytification; local contractibility of X^an is proved by Łojasiewicz's gradient-flow
    retraction from the Łojasiewicz gradient inequality. For use by other lana-agents projects the
    repository also proves Serre's finiteness theorem on projective space over a noetherian ring,
    Zariski's connectedness theorem over a complete discrete valuation ring, and the uniformisation
    of once-punctured elliptic curves over ℂ together with the commensurator statement R3.
  authors:
    - "Claude (Anthropic)"
    - "Yuichiro Hoshi"
    - "Junnosuke Koizumi"
    - "Christian Merten"
  responsible_maintainers:
    - "Christian Merten"
  license: "Apache-2.0"

sources:
  - title: "Lecture notes on complex analysis in several variables"
    authors: ["Eberhard Freitag"]
    type: "lecture notes"
    location: "Theorem 10.3 (Oka's coherence theorem) and Lemma 10.4"
    relationship: "adapts"
    note: >-
      The proof of Oka's coherence theorem follows these lecture notes. The rest of the
      development (analytic spaces, analytification, GAGA) follows the classical literature
      (Serre's GAGA paper, SGA 1 Exposé XII for the proper case) without tracking any single
      text; see fidelity.divergences.
    author_endorsement: "not-contacted"
  - title: "Géométrie algébrique et géométrie analytique"
    authors: ["Jean-Pierre Serre"]
    id: "doi:10.5802/aif.59"
    type: "article"
    location: "Annales de l'Institut Fourier 6 (1956), 1-42"
    relationship: "adapts"
    note: "GAGA for projective schemes follows Serre's proof."
    author_endorsement: "n/a"
  - title: "Revêtements étales et groupe fondamental (SGA 1), Exposé XII"
    authors: ["Alexander Grothendieck", "Michèle Raynaud"]
    id: "arXiv:math/0206203"
    type: "book"
    location: "Exposé XII, §4 and §5"
    relationship: "adapts"
    note: >-
      The reduction of GAGA for proper schemes to the projective case via Chow's lemma follows
      the strategy of SGA 1 XII §4, with the changes listed under fidelity.divergences. The
      Riemann existence theorem follows the overall strategy of SGA 1 XII §5.
    author_endorsement: "n/a"
  - title: "Komplexe Räume"
    authors: ["Hans Grauert", "Reinhold Remmert"]
    id: "https://eudml.org/doc/160651"
    type: "article"
    location: "Math. Ann. 136 (1958), 245-318, §§11-14"
    relationship: "adapts"
    note: >-
      The extension of finite étale covers across hypersurfaces (coherence of the sheaf of
      bounded sections) follows the Grauert–Remmert route through ℙ¹-caps, Puiseux expansions
      with parameters and blow-ups of codimension-2 centres, with the changes listed under
      fidelity.divergences.
    author_endorsement: "n/a"

related_formalizations:
  - id: "https://github.com/lana-agents/pi1"
    relationship: "builds-on"
    note: >-
      The étale fundamental group of a scheme (AlgebraicGeometry.FiniteEtale.galoisCategory,
      AlgebraicGeometry.FiniteEtale.fiber), the algebraic side of the π₁ comparison theorem.
  - id: "https://github.com/lana-agents/heights"
    relationship: "builds-on"
    note: >-
      The modular j-function and the lattice parametrisation of Weierstrass curves over ℂ, used
      in Oka/Uniformization/.
  - id: "https://github.com/lana-agents/tempered-fundamental-groups"
    relationship: "other"
    note: "Downstream consumer of Serre finiteness and Zariski's connectedness theorem."
  - id: "https://github.com/lana-agents/iut"
    relationship: "other"
    note: "Downstream consumer (through its dependencies)."

