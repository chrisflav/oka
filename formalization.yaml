    (connected) schemes locally of finite type over ℂ, local contractibility of X^an via the
    Łojasiewicz gradient inequality, Serre's finiteness theorem on ℙⁿ over a noetherian ring,
    Zariski's connectedness theorem over a complete discrete valuation ring, and the
    uniformisation of once-punctured elliptic curves over ℂ, proved from Lean's three standard
    axioms.
