automation:
  methods:
    - method: "manual"
      prompting_notes: >-
        The statement and the proof of Oka's coherence lemma on open subsets of ℂⁿ (`oka`,
        Oka/Statement.lean) were written by hand.
    - method: "agent"
      models: ["claude-fable-5", "claude-opus-5", "claude-opus-5-5"]
      framework: "Claude Code"
      tool_setup: >-
        Claude Code agents working on the repository with Lean, Lake and the project CI
        (`lake build --wfail`, Batteries environment linters), with subagents for parallel stages.
      prompting_notes: >-
        Apart from Oka's coherence lemma, the formalization was carried out completely by Claude
        (Fable 5, Opus 5 and Opus 5.5), following lecture notes by Eberhard Freitag for Oka's
        theorem. Human input consisted of high-level task descriptions and scope decisions.
  notes: >-
    Everything except the statement and proof of Oka's coherence lemma was formalised by Claude.

fidelity:
  divergences: >-
    Analytic spaces are locally ringed spaces with a ℂ-algebra structure, locally isomorphic to
    subspaces cut out by finitely many holomorphic functions in open subsets of ℂⁿ; no separation
    axiom is imposed. Coherence is formulated for sheaves of modules on a site. For GAGA on proper
    schemes the proof differs from SGA 1 XII in two places: the relative comparison for the Chow
    morphism is proved directly over boxes using Cartan's Theorem B for 𝒪 on product domains and
    algebraic syzygies (no Grauert direct image theorem), and essential surjectivity avoids the
    comparison of Ext¹ groups by an Artin–Rees embedding argument combined with GAGA-2 and
    Rückert's Nullstellensatz. The Nullstellensatz is proved for the zero locus of a finite
    generating family of an ideal.

review:
  status: "unchecked"
  reviewers: []
  notes: >-
    All results are machine-checked by the Lean kernel; the main theorems depend only on propext,
    Classical.choice and Quot.sound. The formal statements have not been independently reviewed
    by a human beyond the hand-written statement of Oka's coherence lemma.

alignment:
  namespace: "ComplexAnalytic"
  statements:
    - source: "Freitag, Theorem 10.3 (Oka's coherence theorem, relations are locally finitely generated)"
      lean: "oka"
      module: "Oka/Statement.lean"
      status: "proved"
    - source: "Oka's coherence theorem for complex analytic spaces"
      lean: "ComplexAnalytic.AnalyticSpace.isCoherentStructureSheaf"
      module: "Oka/AnalyticSpace/Coherent.lean"
      status: "proved"
    - source: "Serre, GAGA, Théorèmes 1-3 (projective case)"
      lean: "ComplexAnalytic.gagaFull"
      module: "Oka/Analytification/GAGA/ProjectiveGAGA3.lean"
      status: "proved"
    - source: "SGA 1, Exposé XII, Théorème 4.4 (GAGA for proper schemes)"
      lean: "ComplexAnalytic.gagaFull_proper, ComplexAnalytic.gagaEquivalenceOfIsProperℂ"
      module: "Oka/Analytification/GAGA/Proper/Equivalence.lean"
      status: "proved"

