automation:
  methods:
    - method: "manual"
      prompting_notes: >-
        The statement and the proof of Oka's coherence lemma on open subsets of ℂⁿ (`oka`,
        Oka/Statement.lean) were written by hand.
    - method: "agent"
      models: ["claude-fable-5", "claude-opus-4-8", "claude-opus-5", "claude-opus-5-5"]
      framework: "Claude Code"
      tool_setup: >-
        orchestra for running the agents, taxis for project management, and Claude (Claude Code) as the
        coding agent; Lean/Lake builds with `lake build --wfail`.
      prompting_notes: >-
        Apart from Oka's coherence lemma, the formalization was carried out completely by Claude
        (Fable 5, Opus 4.8, Opus 5 and Opus 5.5), following lecture notes by Eberhard Freitag for
        Oka's theorem. Human input consisted of high-level task descriptions and scope decisions.
  notes: >-
    Agents were run with orchestra; project management (issues, status) was done in taxis;
    Claude was the coding agent. Everything except the statement and proof of Oka's coherence
    lemma was formalised by Claude.

fidelity:
  divergences: >-
    Analytic spaces are locally ringed spaces with a ℂ-algebra structure, locally isomorphic to
    subspaces cut out by finitely many holomorphic functions in open subsets of ℂⁿ; no separation
    axiom is imposed. Coherence is formulated for sheaves of modules on a site. For GAGA on proper
    schemes the proof differs from SGA 1 XII in two places: the relative comparison for the Chow
    morphism is proved directly over boxes using Cartan's Theorem B for 𝒪 on product domains and
    algebraic syzygies (no Grauert direct image theorem), and essential surjectivity avoids the
    comparison of Ext¹ groups by an Artin–Rees embedding argument combined with GAGA-2 and
    Rückert's Nullstellensatz. The Nullstellensatz is proved for the zero locus of a finite
    generating family of an ideal. For the Riemann existence theorem, finite étale covers of X^an
    are required to have separated structure map (otherwise the statement is false). The
    Grauert–Remmert extension is proved without Oka's normalisation theorem and without a
    primitive element: coherence of the sheaf of bounded sections follows from a reflexive-hull
    criterion, generation by sections obtained from relative Theorem A on the ℙ¹-cap, a Plücker
    lemma with Levi-type common denominators, Lagrange interpolation, and the Noether property of
    coherent sheaves.

review:
  status: "agent-reviewed"
  reviewers: ["Claude (Anthropic)"]
  notes: >-
    The formalization has only been reviewed by Claude; it has not been reviewed by a human.
    All results are machine-checked by the Lean kernel (axioms as listed under status). The axioms
    were checked with `#print axioms` on built checkouts of this code for all main results (for
    the two uniformisation results, a checkout just before a 6-line addition to
    Oka/Uniformization/Depth.lean). For etaleFundamentalGroupEquivCompletion,
    locallyContractibleSpace_analytification and exists_lojasiewicz_gradient, `#print axioms` was
    run on 2026-10-09 in a built checkout at 192edb0, an ancestor of this revision; the repository
    contains no `sorry`, `axiom` or `opaque` declaration (checked by grep).

alignment:
  namespace: "ComplexAnalytic"
  statements:
    - source: "Freitag, Theorem 10.3 (Oka's coherence theorem, relations are locally finitely generated)"
      lean: "oka"
      module: "Oka/Statement.lean"
      status: "proved"
    - source: "Oka's coherence theorem for complex analytic spaces"
      lean: "ComplexAnalytic.AnalyticSpace.isCoherentStructureSheaf"
      module: "Oka/AnalyticSpace/Coherent.lean"
      status: "proved"
    - source: "Serre, GAGA, Théorèmes 1-3 (projective case)"
      lean: "ComplexAnalytic.gagaFull"
      module: "Oka/Analytification/GAGA/ProjectiveGAGA3.lean"
      status: "proved"
    - source: "SGA 1, Exposé XII, Théorème 4.4 (GAGA for proper schemes)"
      lean: "ComplexAnalytic.gagaFull_proper, ComplexAnalytic.gagaEquivalenceOfIsProperℂ"
      module: "Oka/Analytification/GAGA/Proper/Equivalence.lean"
      status: "proved"
    - source: "SGA 1, Exposé XII, Théorème 5.1 (Riemann existence theorem)"
      lean: "ComplexAnalytic.riemannExistenceTheorem, ComplexAnalytic.riemannExistenceTheoremEquiv"
      module: "Oka/Analytification/RET/RiemannExistence.lean"
      status: "proved"
      note: "Covers of X^an are required to have separated structure map."
    - source: "Grauert–Remmert, Komplexe Räume, Satz 33 (extension of coverings), local form"
      lean: "ComplexAnalytic.BoundedSections.isCoherent_boundedModule_of_hasThinComplement"
      module: "Oka/Analytification/RET/ES/CapExtension.lean"
      status: "proved"
    - source: "SGA 1, Exposé XII, Corollaire 5.2 (π₁ᵉᵗ is the profinite completion of π₁ of X^an)"
      lean: "ComplexAnalytic.etaleFundamentalGroupEquivCompletion"
      module: "Oka/Analytification/Pi1/General.lean"
      status: "proved"
    - source: "Łojasiewicz gradient inequality for real polynomials"
      lean: "MvPolynomial.exists_lojasiewicz_gradient"
      module: "Oka/Geometry/RealAlgebraic/Lojasiewicz.lean"
      status: "proved"
    - source: "Serre's finiteness theorem for coherent sheaves on ℙⁿ (Čech cohomology)"
      lean: "AlgebraicGeometry.ProjectiveSpace.cechFinite_of_isCoherent"
      module: "Oka/AlgebraicGeometry/ProjectiveSpace/SerreFiniteness.lean"
      status: "proved"
    - source: "Zariski's connectedness theorem (closed fibre over a complete DVR)"
      lean: "AlgebraicGeometry.ProjectiveSpace.isPreconnected_closedFibre"
      module: "Oka/AlgebraicGeometry/ProjectiveSpace/ZariskiConnected.lean"
      status: "proved"

